<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&amp;display=swap');

      /* RESET & BASE */
      .svg-wrapper {
        cursor: pointer;
        font-family: 'JetBrains Mono', Consolas, monospace;
      }

      /* TITOLO NEON */
      .title {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 20px;
        font-weight: 600;
        fill: #00FFFF;
        text-anchor: middle;
        opacity: 0;
        transition: opacity 0.5s ease-out;
        filter: drop-shadow(0px 0px 5px rgba(0, 255, 255, 0.8));
      }

      .svg-wrapper:hover .title {
        opacity: 1;
      }

      /* TRANSIZIONI GENERALE */
      .robot-group, .body, .arm-right, .magnet, .spine, .shdw-1 {
        transition: all 0.7s cubic-bezier(0.94, 0, 1, 1);
      }
      .arm-left, .arm-right {
        transition: all 1.5s ease;
      }
      .robot {
        transition: all 0.7s ease-in;
      }
      .brow-right {
        transition: all 4s ease;
        transform-origin: 20px 20px;
        transform: translate(-10px);
      }

      /* STATI INIZIALI (Robot Bloccato) */
      .body {
        transform-origin: 95px 100px;
        transform: rotate(-58deg) translate(-57px, -39px);
      }
      .spine {
        stroke: #7A5CFF;
        stroke-width: 30;
        stroke-dasharray: 2, 0;
      }
      .arm-right {
        transform-origin: 130px 180px;
        transform: translate(0) rotate(95deg);
      }
      .arm-left {
        transform-origin: 60px 80px;
        transform: translate(32px, 10px) rotate(-150deg);
      }
      .shdw-1, .shdw-2 {
        stroke: #21262d;
        stroke-dasharray: 130;
        stroke-dashoffset: -20;
      }
      .magnet {
        transform: translateX(80px) translateY(0px);
      }
      .panel {
        stroke: #00FFFF;
        stroke-width: 10;
        stroke-dasharray: 4;
        stroke-dashoffset: 1;
      }

      /* STATI HOVER */
      .svg-wrapper:hover .robot {
        transform: translateX(10px);
      }
      .svg-wrapper:hover .spine {
        stroke-dasharray: 5, 3;
        stroke-dashoffset: -10;
      }
      .svg-wrapper:hover .body, 
      .svg-wrapper:hover .arm-right, 
      .svg-wrapper:hover .arm-left {
        transform: translate(0) rotate(0deg);
      }
      .svg-wrapper:hover .brow-right {
        animation: brow 1s ease infinite alternate;
        animation-delay: 0.7s;
      }
      .svg-wrapper:hover .shdw-1 {
        stroke-dasharray: 220;
        stroke-dashoffset: -40;
      }
      .svg-wrapper:hover .magnet {
        transform: translateX(0) translateY(0px);
      }
      .svg-wrapper:hover .mag {
        animation: none;
      }
      .svg-wrapper:hover .panel {
        animation: panel 0.8s alternate infinite ease-in-out;
        animation-delay: 0.7s;
      }

      /* KEYFRAMES */
      .magnet .mag {
        animation: magnabounce 1s alternate infinite ease-in-out;
      }

      @keyframes magnabounce {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }

      @keyframes panel {
        0% { stroke-dashoffset: 0%; }
        50% { stroke-dashoffset: 20%; }
        100% { stroke-dashoffset: 0%; }
      }

      @keyframes brow {
        to { transform: translate(15px); }
      }
    </style>
  </defs>

  <g class="svg-wrapper">
    <!-- Titolo Neon integrato nell'SVG -->
    <text x="150" y="25" class="title">Nice to meet you! I'm a robot!</text>

    <!-- Gruppo Grafica Robot spostato leggermente in basso per far spazio al titolo -->
    <g class="robot-group" transform="translate(0, 30)">
      <g class="shadows">          
        <line class="shdw-1" fill="none" stroke="#30363d" stroke-width="10" stroke-linecap="round" stroke-miterlimit="10" x1="-20" y1="277" x2="200" y2="277"/>
      </g>
      
      <g class="magnet">
        <g class="mag">
          <path fill="#7A5CFF" d="M223.4 180.1h-50.1V143h50.1c13.8 0 25-11.2 25-25s-11.2-25-25-25h-50.1V55.8h50.1c34.3 0 62.2 27.9 62.2 62.1 0 34.3-27.9 62.2-62.2 62.2z"/>
          <path fill="#8b949e" d="M148.9 143h30v37.2h-30zM148.9 55.8H179V93h-30.1z"/>
        </g>
        <line class="shdw-2" fill="none" stroke="#30363d" stroke-width="10" stroke-linecap="round" stroke-miterlimit="10" x1="150" y1="277" x2="260" y2="277"/>
      </g>

      <g class="robot">
        <g class="spine">
