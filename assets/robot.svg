          <path fill="#00FFFF" d="M35.1 205.1h10.8v57.6H35.1z"/>
          <path fill="#161b22" d="M35.1 205.1h10.8v10.8H35.1z"/>
          <path fill="#00FFFF" d="M81.9 205.1h9.9v57.6h-9.9z"/>
          <path fill="#161b22" d="M81.9 205.1h9.9v10.8h-9.9z"/>
          <path fill="#00FFFF" d="M56.7 271.6c0-6.3-5.4-10.8-11.7-10.8h-9c-6.3 0-11.7 4.5-11.7 10.8h32.4z"/>
          <path fill="#161b22" d="M24.3 271.6h32.4v6.3H24.3z"/>
          <path fill="#00FFFF" d="M103.5 271.6c-.9-6.3-6.3-10.8-12.6-10.8h-8.1c-6.3 0-11.7 4.5-12.6 10.8h33.3z"/>
          <path fill="#161b22" d="M70.2 271.6h33.3v6.3H70.2z"/>
        </g>

        <g class="body">
          <g class="arm-left">
            <path fill="#7A5CFF" d="M94.2 73.4L76.6 59.5 57.1 84.1 74.8 98c2.1 1.7 5.9 1.2 7.6-.9l12.8-16.2c1.6-2.1 1.2-5.9-1-7.5"/>
            <path fill="#00FFFF" d="M90.782 70.6L82.3 63.912l20.55-26.076 8.483 6.686z"/>
            <path fill="#161b22" d="M90.634 70.563L82.15 63.88l7.242-9.192 8.484 6.685z"/>
            <g>
              <path fill="#00FFFF" d="M121.883 47.893l5.27-9.426 21.91 12.25-5.273 9.428z"/>
              <path fill="#161b22" d="M121.9 47.938l5.272-9.426 10.21 5.71-5.27 9.427z"/>
              <path fill="#7A5CFF" d="M124.8 29.9c3.1 1.8 3.7 6.2 2 9.3l-4.8 8.6c-1.8 3.1-5.4 4.2-8.6 2.4l-17.2-9.6c-3.1-1.8-4.2-5.4-2.4-8.6l4.8-8.6c1.8-3.1 5.9-5 9-3.2l17.2 9.7z"/>
              <path fill="#00FFFF" d="M157.2 67.6c-2.4.7-4.4.6-6-.3-3.9-2.2-5.3-7.1-3.1-11 2.2-3.9 7.1-5.3 11-3.1 1.6.9 2.7 2.5 3.4 5l7.3-2.1c-1-3.7-4.1-7.4-7.2-9.2-7.8-4.4-17.2-2.4-21.6 5.4-4.4 7.9-1.2 16.9 6.6 21.2 3.1 1.8 7.9 2.4 11.6 1.3l-2-7.2z"/>
            </g>
          </g>

          <g class="arm-right">
            <path fill="#7A5CFF" d="M143.8 185.7l-19.2 9.9-14.4-27.9 19.2-9.9c3.2-1.6 6-.1 7.3 2.3l9.5 18.4c1.1 2.3.7 5.5-2.4 7.2"/>
            <path fill="#00FFFF" d="M154.937 217.202l-8.8 4.535-15.21-29.512 8.8-4.535z"/>
            <path fill="#161b22" d="M145.03 198.096l-8.8 4.537-5.362-10.4 8.8-4.538z"/>
            <path fill="#00FFFF" d="M176.65 183.235l7.005 6.997-17.738 17.76-7.005-6.996z"/>
            <path fill="#161b22" d="M167.136 192.7l7.005 6.996-8.268 8.28-7.005-6.998z"/>
            <path fill="#00FFFF" d="M186.8 171.8c-1.9.6-3.8 1.3-5.1 2.5-3.2 3.2-3.2 8.3-.6 10.8 3.2 3.2 8.3 3.2 11.4 0 1.3-1.3 1.9-3.2 2.5-5.1h7.6c0 3.8-1.9 8.3-4.4 10.8-6.3 6.4-16.5 6.4-22.9 0-5.7-5.7-5.7-15.9.6-22.2 2.5-2.5 7-4.5 10.8-4.5l.1 7.7z"/>
            <path fill="#7A5CFF" d="M165.9 216.9c2.5-2.5 2.5-6.4 0-8.9l-7-7c-2.5-2.5-6.4-2.5-8.9 0l-14 14c-2.5 2.5-2.5 6.4 0 8.9l7 7c2.5 2.5 6.4 2.5 8.9 0l14-14z"/>
          </g>

          <path fill="#7A5CFF" d="M154.4 99.8c-10-16-31.5-21.7-47.5-11.7l36.7 58.7c16-9.9 20.8-31 10.8-47"/>
          <path fill="#161b22" d="M66.06 121.063l30.51 48.857-5.344 3.337-30.51-48.856z"/>
          <path fill="#9B7BFF" d="M98.443 71.167l56.202 89.995-46.482 29.028-56.202-89.995z"/>
          <path fill="#161b22" d="M118.6 156.1c-4.6 2.9-11.5 1.9-14.9-3.4l-20.5-32.8c-2.9-4.6-1.1-12 3.4-14.9 5.3-3.3 12.8-1.6 15.6 3l20.5 32.8c3.4 5.3 1.3 12-4.1 15.3"/>
          <path class="eye-right" fill="#00FFFF" d="M148.2 128.6c-1.5 1-5.2.1-6.2-1.4-1.4-2.3-.1-5.2 1.4-6.2 2.3-1.4 4.8-.9 6.2 1.4 1 1.6.9 4.8-1.4 6.2"/>
          <path class="eye-left" fill="#00FFFF" d="M130.1 99.6c-1.5 1-4.8.9-6.2-1.4-1.4-2.3-.1-5.2 1.4-6.2 2.3-1.4 4.8-.9 6.2 1.4 1.5 2.3.9 4.8-1.4 6.2"/>
          <path class="brow-right" fill="none" stroke="#00FFFF" stroke-width="4" stroke-miterlimit="10" d="M167.3 125l-2.3-12.9" stroke-linecap="round"/>
          <path class="brow-left" fill="none" stroke="#00FFFF" stroke-width="4" stroke-miterlimit="10" d="M134.3 88.7l10.7 7.6" stroke-linecap="round"/>
          <path class="panel" fill="none" stroke-miterlimit="10" d="M91.167 112.833l22.166 35.333" />
