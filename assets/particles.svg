<svg width="1280" height="300"
xmlns="http://www.w3.org/2000/svg">


<rect width="1280"
height="300"
fill="#09001A"/>


<g fill="#00FFFF">

<circle cx="100" cy="80" r="3">

<animate
attributeName="cy"
values="80;40;80"
dur="3s"
repeatCount="indefinite"/>

</circle>


<circle cx="500" cy="150" r="4">

<animate
attributeName="cy"
values="150;80;150"
dur="4s"
repeatCount="indefinite"/>

</circle>


<circle cx="1000" cy="100" r="3">

<animate
attributeName="cy"
values="100;180;100"
dur="5s"
repeatCount="indefinite"/>

</circle>

</g>


</svg>